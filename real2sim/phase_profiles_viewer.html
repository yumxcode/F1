<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Phase Profiles</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'SF Pro Text', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
.top { background: #1e293b; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; border-bottom: 1px solid #334155; }
.top label { font-size: 12px; color: #94a3b8; margin-right: 4px; }
select, .btn { background: #0f172a; color: #e2e8f0; border: 1px solid #475569; border-radius: 6px; padding: 5px 10px; font-size: 13px; cursor: pointer; }
select:hover, .btn:hover { border-color: #7c3aed; }
.steps { display: flex; gap: 4px; }
.step-btn { background: #1e293b; border: 1px solid #475569; color: #94a3b8; border-radius: 5px; padding: 4px 10px; font-size: 12px; cursor: pointer; transition: all .15s; }
.step-btn.active { background: #7c3aed; border-color: #7c3aed; color: white; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 16px; background: #1e293b; border-bottom: 1px solid #334155; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; }
.legend-swatch { width: 24px; height: 3px; border-radius: 2px; }
.main { padding: 12px 16px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.chart-wrap { background: #1e293b; border-radius: 10px; padding: 10px; }
.chart-title { font-size: 12px; color: #94a3b8; margin-bottom: 6px; text-align: center; }
canvas { width: 100%; height: 220px; display: block; }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="top">
  <div>
    <label>Joint</label>
    <select id="selJoint">
      <option value="ankle_roll">ankle_roll</option>
      <option value="ankle_pitch">ankle_pitch</option>
      <option value="hip_pitch">hip_pitch</option>
      <option value="knee_pitch">knee_pitch</option>
    </select>
  </div>
  <div>
    <label>Window</label>
    <select id="selWindow">
      <option value="swing">swing</option>
      <option value="touchdown">touchdown</option>
    </select>
  </div>
  <div>
    <label>Role</label>
    <select id="selRole">
      <option value="event_leg">event_leg</option>
      <option value="opposite_leg">opposite_leg</option>
    </select>
  </div>
  <div>
    <label>Step</label>
    <div class="steps" id="stepBtns">
      <button class="step-btn active" data-step="1" onclick="setStep(1)">1</button><button class="step-btn" data-step="2" onclick="setStep(2)">2</button><button class="step-btn" data-step="3" onclick="setStep(3)">3</button><button class="step-btn" data-step="4" onclick="setStep(4)">4</button><button class="step-btn" data-step="5" onclick="setStep(5)">5</button><button class="step-btn" data-step="6" onclick="setStep(6)">6</button>
      <button class="step-btn" data-step="all" onclick="setStep('all')">All</button>
    </div>
  </div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-swatch" style="background:#2563eb;"></div><span style="color:#2563eb">Kp=25</span></div><div class="legend-item"><div class="legend-swatch" style="background:#16a34a;"></div><span style="color:#16a34a">Kp=30</span></div><div class="legend-item"><div class="legend-swatch" style="background:#ea580c;"></div><span style="color:#ea580c">Kp=35</span></div><div class="legend-item"><div class="legend-swatch" style="background:#dc2626;"></div><span style="color:#dc2626">Kp=40</span></div>
  <div class="legend-item" style="margin-left:12px"><div class="legend-swatch" style="background:#e2e8f0;"></div><span>─ Real joint</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:#94a3b8; opacity:.7"></div><span>- - Real target</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:#e2e8f0; opacity:.5"></div><span>⋯ Sim joint</span></div>
</div>

<div class="main">
  <div class="grid" id="chartGrid"></div>
</div>

const CASES_REAL = ["25/0.4 all_ankles", "30/0.4 all_ankles", "35/0.5 all_ankles", "40/0.8 all_ankles"];
const CASES_SIM  = ["2504", "3505", "4005", "5008"];
const KP_LABELS  = ["Kp=25", "Kp=30", "Kp=35", "Kp=40"];
const COLORS     = ["#2563eb", "#16a34a", "#ea580c", "#dc2626"];

let curStep = 1;
let curJoint = 'ankle_roll';
let curWindow = 'swing';
let curRole = 'event_leg';

const dpr = window.devicePixelRatio || 1;

function lookup(ds, cas, joint, window, role, step) {
  const k = `${ds}|${cas}|${joint}|${window}|${role}|${step}`;
  return DATA[k] || null;
}

function setStep(s) {
  curStep = s;
  document.querySelectorAll('.step-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.step == String(s));
  });
  render();
}

function drawChart(canvas, title, series) {
  const w = canvas.clientWidth  || 400;
  const h = canvas.clientHeight || 220;
  canvas.width  = w * dpr;
  canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const pad = { l:44, r:12, t:12, b:30 };
  const cw = w - pad.l - pad.r;
  const ch = h - pad.t - pad.b;

  // Gather all y values
  let ymin = Infinity, ymax = -Infinity;
  series.forEach(s => {
    s.y.forEach(v => { if(v<ymin) ymin=v; if(v>ymax) ymax=v; });
  });
  const ypad = Math.max((ymax-ymin)*0.12, 1);
  ymin -= ypad; ymax += ypad;

  const xsc = x => pad.l + x * cw;
  const ysc = y => pad.t + (1-(y-ymin)/(ymax-ymin)) * ch;

  // Grid
  ctx.strokeStyle = '#1e3a5f';
  ctx.lineWidth = 0.5;
  for(let g=0; g<=4; g++) {
    const yv = ymin + (ymax-ymin)*g/4;
    ctx.beginPath(); ctx.moveTo(pad.l, ysc(yv)); ctx.lineTo(pad.l+cw, ysc(yv)); ctx.stroke();
    ctx.fillStyle='#475569'; ctx.font='10px system-ui'; ctx.textAlign='right';
    ctx.fillText(yv.toFixed(1)+'°', pad.l-4, ysc(yv)+3);
  }
  for(let g=0; g<=4; g++) {
    const xv = g/4;
    ctx.beginPath(); ctx.moveTo(xsc(xv), pad.t); ctx.lineTo(xsc(xv), pad.t+ch); ctx.stroke();
    ctx.fillStyle='#475569'; ctx.font='10px system-ui'; ctx.textAlign='center';
    ctx.fillText(xv.toFixed(2), xsc(xv), pad.t+ch+12);
  }

  // Zero line
  if(ymin < 0 && ymax > 0) {
    ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(pad.l, ysc(0)); ctx.lineTo(pad.l+cw, ysc(0)); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Series
  series.forEach(s => {
    if(!s.x || !s.y || s.x.length === 0) return;
    ctx.beginPath();
    ctx.strokeStyle = s.color;
    ctx.lineWidth = s.lw || 1.8;
    ctx.globalAlpha = s.alpha || 1;
    if(s.dash) ctx.setLineDash(s.dash);
    else ctx.setLineDash([]);
    s.x.forEach((xv, i) => {
      const px = xsc(xv), py = ysc(s.y[i]);
      i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
    });
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  });

  // Title
  ctx.fillStyle='#94a3b8'; ctx.font='11px system-ui'; ctx.textAlign='center';
  ctx.fillText(title, pad.l + cw/2, 10);
  // Axes labels
  ctx.fillStyle='#475569'; ctx.font='9px system-ui'; ctx.textAlign='center';
  ctx.fillText('norm phase', pad.l+cw/2, h-2);
}

function render() {
  const grid = document.getElementById('chartGrid');
  grid.innerHTML = '';

  const steps = curStep === 'all' ? [1,2,3,4,5,6] : [curStep];
  steps.forEach(step => {
    const wrap = document.createElement('div');
    wrap.className = 'chart-wrap';
    const title = document.createElement('div');
    title.className = 'chart-title';
    title.textContent = `Step ${step} — ${curJoint} / ${curWindow} / ${curRole}`;
    const canvas = document.createElement('canvas');
    canvas.style.height = '220px';
    wrap.appendChild(title);
    wrap.appendChild(canvas);
    grid.appendChild(wrap);

    const series = [];
    CASES_REAL.forEach((cas, i) => {
      const d = lookup('real', cas, curJoint, curWindow, curRole, step);
      if(d) {
        series.push({ x: d.p, y: d.j, color: COLORS[i], lw: 2, alpha: 1,    dash: [],       label: KP_LABELS[i]+' joint' });
        series.push({ x: d.p, y: d.t, color: COLORS[i], lw: 1.2, alpha: .6, dash: [5,3],    label: KP_LABELS[i]+' target' });
      }
    });
    CASES_SIM.forEach((cas, i) => {
      const d = lookup('sim', cas, curJoint, curWindow, curRole, step);
      if(d) {
        series.push({ x: d.p, y: d.j, color: COLORS[i], lw: 1.2, alpha: .45, dash: [2,2],  label: KP_LABELS[i]+' sim joint' });
      }
    });

    // Draw after layout
    requestAnimationFrame(() => {
      canvas.style.width = '100%';
      canvas.style.height = '220px';
      const cw = wrap.clientWidth - 20;
      canvas.width = cw * dpr;
      canvas.height = 220 * dpr;
      drawChart(canvas, title.textContent, series);
    });
  });
}

document.getElementById('selJoint').addEventListener('change', e => { curJoint = e.target.value; render(); });
document.getElementById('selWindow').addEventListener('change', e => {
  curWindow = e.target.value;
  const roles = curWindow === 'swing' ? ['event_leg','opposite_leg'] : ['landing_leg','stance_leg'];
  const sel = document.getElementById('selRole');
  sel.innerHTML = roles.map(r=>`<option value="${r}">${r}</option>`).join('');
  curRole = roles[0];
  render();
});
document.getElementById('selRole').addEventListener('change', e => { curRole = e.target.value; render(); });

render();
</script>
