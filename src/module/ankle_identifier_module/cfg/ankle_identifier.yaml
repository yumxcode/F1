joint_cmd_topic: /joint_cmd
joint_state_topic: /joint_states
imu_topic: /imu/data

mode: step
test_side: left
test_axis: pitch

publish_rate_hz: 1000.0
pre_hold_sec: 2.0
active_sec: 1.0
post_hold_sec: 2.0
repeat_count: 3

step_amplitude_rad: 0.005
sine_amplitude_rad: 0.004
sine_frequency_hz: 1.0

test_kp: 35.0
test_kd: 0.8
hold_kp: 30.0
hold_kd: 1.0

use_imu: true
auto_stop_after_test: true
csv_path: ./log/left_pitch_step.csv
